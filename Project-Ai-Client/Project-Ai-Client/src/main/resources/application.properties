spring.application.name=Project-Ai-Client

server.port=8081
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=gpt-5
spring.ai.openai.chat.options.temperature=1

spring.ai.mcp.client.enabled=true

spring.ai.mcp.client.streamable-http.connections.mcpserver.url=http://localhost:8080